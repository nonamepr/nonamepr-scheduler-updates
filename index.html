<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>무명기획 스케줄러</title>
    <meta name="theme-color" content="#12141a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="스케줄러" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 로그인 -->
    <section id="login" class="hidden">
      <form id="login-form" class="login-box">
        <img src="icons/icon-192.png" alt="" class="login-logo" />
        <h1>무명기획 스케줄러</h1>
        <input id="login-email" class="input" type="email" placeholder="이메일" autocomplete="username" inputmode="email" autocapitalize="off" />
        <input id="login-pw" class="input" type="password" placeholder="비밀번호" autocomplete="current-password" />
        <p id="login-error" class="err hidden"></p>
        <button type="submit" class="btn primary block" id="login-btn">로그인</button>
      </form>
    </section>

    <!-- 앱 -->
    <div id="app" class="hidden">
      <header class="appbar">
        <h1 id="ab-title">오늘</h1>
        <button id="ab-bell" class="icon-btn bell" aria-label="알림">🔔<span id="ab-badge" class="badge hidden">0</span></button>
      </header>

      <main id="views">
        <!-- 오늘 -->
        <section id="v-today" class="view">
          <div class="day-head">
            <button id="t-prev" class="icon-btn" aria-label="이전 날">‹</button>
            <button id="t-date" class="date-wrap"><span id="t-big" class="date-big"></span><span id="t-sub" class="date-sub"></span></button>
            <button id="t-next" class="icon-btn" aria-label="다음 날">›</button>
            <input id="t-pick" type="date" class="pick-hidden" tabindex="-1" aria-hidden="true" />
          </div>
          <div class="sub-row">
            <label id="t-owner-row" class="owner-row hidden"><select id="t-owner" class="input slim"></select></label>
            <button id="t-today" class="chip hidden">오늘로</button>
          </div>
          <div class="progress"><div class="bar"><div id="t-fill" class="bar-fill"></div></div><span id="t-prog">—</span></div>
          <div id="t-overdue" class="overdue hidden">
            <span id="t-overdue-text"></span>
            <button id="t-overdue-show" class="mini">보기</button>
            <button id="t-overdue-carry" class="mini primary">오늘로 옮기기</button>
          </div>
          <ul id="t-list" class="list"></ul>
          <form id="t-add" class="add-bar">
            <input id="t-add-input" class="input" type="text" placeholder="할 일 입력" autocomplete="off" enterkeyhint="done" />
            <button type="submit" class="btn primary add-btn" aria-label="추가">＋</button>
          </form>
        </section>

        <!-- 달력 -->
        <section id="v-cal" class="view hidden">
          <div class="day-head">
            <button id="c-prev" class="icon-btn" aria-label="이전 달">‹</button>
            <b id="c-month" class="month-title"></b>
            <button id="c-next" class="icon-btn" aria-label="다음 달">›</button>
          </div>
          <div class="sub-row">
            <label id="c-owner-row" class="owner-row hidden"><select id="c-owner" class="input slim"></select></label>
            <button id="c-today" class="chip">이번 달</button>
          </div>
          <div id="c-grid" class="c-grid"></div>
          <div class="c-day">
            <div class="c-day-head"><b id="c-day-title"></b>
              <span><button id="c-goday" class="mini">이 날로</button><button id="c-add" class="mini primary">+ 추가</button></span></div>
            <ul id="c-day-list" class="list"></ul>
          </div>
        </section>

        <!-- 매체 점검 -->
        <section id="v-insp" class="view hidden">
          <div class="toolbar">
            <input id="i-search" class="input" type="search" placeholder="병원·매체·담당·내용 검색" />
            <button id="i-add" class="btn primary">+ 카드</button>
          </div>
          <div class="filters">
            <select id="i-media" class="input slim"></select>
            <select id="i-day" class="input slim">
              <option value="all">모든 요일</option><option value="today">오늘 점검</option>
              <option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option>
              <option value="6">토</option><option value="0">일</option><option value="none">요일 없음</option>
            </select>
            <select id="i-status" class="input slim"><option value="active">진행 중</option><option value="ended">종료</option><option value="all">전체</option></select>
          </div>
          <p id="i-summary" class="summary"></p>
          <div id="i-list"></div>
        </section>

        <!-- 회의 -->
        <section id="v-meet" class="view hidden">
          <p id="m-empty" class="empty hidden">볼 수 있는 회의가 없습니다.<br>회의는 참석자·보기 전용으로 지정된 사람만 볼 수 있습니다.</p>
          <div id="m-main">
            <select id="m-rule" class="input"></select>
            <div class="day-head">
              <button id="m-prev" class="icon-btn" aria-label="지난 회의">‹</button>
              <div class="date-wrap"><span id="m-date" class="date-big small"></span></div>
              <button id="m-next" class="icon-btn" aria-label="다음 회의">›</button>
            </div>
            <div class="sub-row"><button id="m-now" class="chip">이번 회의</button><button id="m-reload" class="chip">⟳ 새로 받기</button></div>
            <p id="m-readonly" class="note hidden">보기 전용입니다. 회의록을 볼 수 있고, 회의 메모만 쓸 수 있습니다.</p>
            <p id="m-summary" class="summary"></p>
            <button id="m-carry-all" class="btn ghost block hidden"></button>
            <div id="m-people"></div>
            <section class="sec"><h3>결정 · 지시 사항 <button id="m-add-dec" class="mini">+ 추가</button></h3><div id="m-decisions"></div></section>
            <section class="sec"><h3>회의 메모 <span id="m-memo-saved" class="saved"></span></h3>
              <textarea id="m-memo" class="input" rows="3" placeholder="자유롭게 적으세요 (자동 저장)"></textarea></section>
          </div>
        </section>

        <!-- 더보기 -->
        <section id="v-more" class="view hidden">
          <div id="mo-me" class="me-card"></div>
          <div class="menu">
            <button class="menu-row" data-menu="notif"><span>🔔 알림</span><span><span id="mo-notif-n" class="badge inline hidden"></span> ›</span></button>
          </div>
          <div id="mo-push" class="menu push-box"></div>
          <div class="menu">
            <button class="menu-row" data-menu="recur"><span>🔁 반복 업무</span><span>›</span></button>
            <button class="menu-row" data-menu="reviews"><span>🛡 심의 관리</span><span>›</span></button>
            <button class="menu-row" data-menu="leaves"><span>🌴 팀 휴가 현황</span><span>›</span></button>
            <button class="menu-row" data-menu="search"><span>🔍 업무 검색</span><span>›</span></button>
            <button class="menu-row" data-menu="overdue"><span>⏰ 지난 미완료 업무</span><span>›</span></button>
          </div>
          <div class="menu">
            <button class="menu-row" data-menu="pw"><span>🔑 비밀번호 변경</span><span>›</span></button>
            <button class="menu-row" data-menu="reload"><span>⟳ 앱 새로 받기</span><span>›</span></button>
            <button class="menu-row danger" data-menu="logout"><span>로그아웃</span><span></span></button>
          </div>
          <p id="mo-version" class="version"></p>
        </section>
      </main>

      <nav class="tabbar">
        <button class="tab on" data-tab="today"><span class="ti">📋</span>오늘</button>
        <button class="tab" data-tab="cal"><span class="ti">📅</span>달력</button>
        <button class="tab" data-tab="insp"><span class="ti">🗂</span>점검</button>
        <button class="tab" data-tab="meet"><span class="ti">🗒</span>회의</button>
        <button class="tab" data-tab="more"><span class="ti">☰</span>더보기</button>
      </nav>
    </div>

    <div id="toast" class="toast hidden"></div>
    <span id="app-version" class="hidden"></span>
    <script type="module" src="app.js"></script>
  </body>
</html>
